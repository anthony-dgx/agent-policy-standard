[project]
name = "agent-policy-standard"
version = "0.1.0"
description = "Reference implementation for Resource-Defined Agent Policies"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server", "sdk", "demo"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
